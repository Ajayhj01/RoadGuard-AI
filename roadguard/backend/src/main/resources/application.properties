server.port=8080

# H2 file-based DB — persists in ./data so restarting the app doesn't wipe your hazards.
# To switch to MySQL for production: uncomment the mysql dependency in pom.xml and replace
# these four lines with your MySQL url/username/password/driver-class-name.
spring.datasource.url=jdbc:h2:file:./data/roadguard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

detection.service.url=http://localhost:8001
